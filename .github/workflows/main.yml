name: main

on: [push]

env:
  BASE_URL: webxr-minimal-demo

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - run: bun install --frozen-lockfile

      - run: bun type

      - run: bun fmt

      - run: |
          for FILE in $( cd src ; find . -name 'demo-*' )
          do
            bunx vite build src/$FILE --base $BASE_URL/$FILE --minify false --outDir ../../dist/$FILE
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
